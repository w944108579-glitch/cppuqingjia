<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日常请假列表</title>
    <script src="auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
        }
        body {
            width: min(100%, 630px);
            max-width: none;
            margin: 0 auto;
            overflow-x: hidden;
            background: #f2f3f5;
			padding-bottom: 98px;
        }
        /* 630 × 1260 参考图等比例布局 */
        .nav-bar {
            width: 100%;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid #e6e6e6;
        }
        .nav-left {
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
            top: 2px;
        }
        .nav-icon {
            position: relative;
            width: 40px;
            height: 40px;
            color: transparent;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .nav-icon:first-child::before {
            content: "";
            position: absolute;
            left: 16px;
            top: 50%;
            width: 16px;
            height: 16px;
            border-left: 3px solid #111;
            border-bottom: 3px solid #111;
            transform: translateY(-50%) rotate(45deg);
        }
        .nav-icon:nth-child(2) {
            margin-left: 49px;
        }
        .nav-icon:nth-child(2)::before,
        .nav-icon:nth-child(2)::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 29px;
            height: 3px;
            border-radius: 1.5px;
            background: #111;
        }
        .nav-icon:nth-child(2)::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .nav-icon:nth-child(2)::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .nav-title {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 2px);
            color: #050505;
            font-size: 18px;
            line-height: 1;
            font-weight: 500;
            white-space: nowrap;
        }
        .nav-right {
            width: 74px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            position: relative;
            top: 3px;
        }
        .nav-right::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #050505;
            box-shadow: 11px 0 #050505, 22px 0 #050505;
            transform: translateX(-11px);
        }
        #leaveListContainer {
            padding: 0;
        }
        .leave-card {
            width: 100%;
            height: 480px;
            padding: 25px 26px 28px;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
            background: #fff;
        }
        .leave-card.has-student {
            height: 549px;
            padding-top: 36px;
        }
        .row-item {
            height: 30px;
            margin-bottom: 29px;
            display: flex;
            align-items: center;
            line-height: 30px;
            white-space: nowrap;
        }
        .row-item:last-of-type {
            margin-bottom: 34px;
        }
        .leave-card.has-student .row-item:last-of-type {
            margin-bottom: 32px;
        }
        .label-text {
            min-width: 115px;
            flex-shrink: 0;
            color: #222;
            font-size: 23px;
            font-weight: 400;
        }
        .value-text {
            flex: 1;
            min-width: 0;
            color: #999;
            font-size: 22px;
            font-weight: 400;
        }
        .time-value {
            letter-spacing: -.06px;
        }
        .detail-link {
            flex-shrink: 0;
            margin-left: 10px;
            color: #45c7c7;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-teal {
            width: 180px;
            height: 50px;
            margin: 0 auto;
            display: block;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(90deg, #27e2d4 0%, #1878e8 100%);
            color: #fff;
            font-size: 18.9px;
            font-weight: 400;
            cursor: default;
            pointer-events: none;
        }
        .corner-tag-orange,
        .corner-tag-purple {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 70px;
            height: 70px;
            color: #fff;
            font-size: 15px;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
        }
        .corner-tag-orange::before,
        .corner-tag-purple::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }
        .corner-tag-orange::before {
            background: #ff9a3c;
        }
        .corner-tag-purple::before {
            background: #9854d1;
        }
		.corner-tag-orange span,
		.corner-tag-purple span {
			position: absolute;
			inset: 0;          /* top right bottom left全部为0 */
			margin: auto;      /* 自动居中 */
			width: 70px;
			height: 70px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 300;  /* 字体变细 */
			text-align: center;
			transform: rotate(-45deg) translate(-2.8px, 16.5px);
		}
        /* 新增：强制绘制右下角白色三角缺口，不再依赖文字溢出 */
        .corner-tag-orange::after,
        .corner-tag-purple::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-bottom: 25px solid #ffffff;
            border-left: 25px solid transparent;
        }

		.btn-bottom {
			position: fixed;
			bottom: max(8px, env(safe-area-inset-bottom));
			left: 50%;
			transform: translateX(-50%);
			width: min(100%, 630px);
			max-width: none;
			height: 60px;
			border: none;
			border-radius: 0;
			background: linear-gradient(90deg, #27e2d4 0%, #1878e8 100%);
			color: #ffffff;
			font-size: 18px;
			font-weight: 400;
			letter-spacing: 2px;
			cursor: pointer;
			z-index: 100;
			transition: opacity 0.2s;
		}

        .btn-bottom:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="nav-bar">
        <div class="nav-left">
            <div class="nav-icon" onclick="exitWebsite()"><</div>
            <div class="nav-icon">×</div>
        </div>
        <div class="nav-title">日常请假列表</div>
        <div class="nav-right">⋯</div>
    </div>
    <!-- 请假列表 -->
    <div id="leaveListContainer">
        <!-- 默认第一条：待销假 -->
        <div class="leave-card has-student" data-record-id="default-20260826" data-start-time="2026-08-26T23:44">
            <div class="corner-tag-orange"><span>待销假</span></div>
            <div class="row-item">
                <span class="label-text">学号</span>
                <span class="value-text">2025903066</span>
                <span class="detail-link" onclick="showDetail(this.closest('.leave-card'))">查看详情 ></span>
            </div>
            <div class="row-item">
                <span class="label-text">姓名</span>
                <span class="value-text">王贺</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假时间</span>
                <span class="value-text time-value">2026-08-26 23:44至2026-08-27 07:44</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假时长</span>
                <span class="value-text">0天8小时</span>
            </div>
            <div class="row-item">
                <span class="label-text">是否续假</span>
                <span class="value-text">否</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假原因</span>
                <span class="value-text">校外:周末外出</span>
            </div>
            <div class="row-item">
                <span class="label-text">销假状态</span>
                <span class="value-text">待销假</span>
            </div>
            <button class="btn-teal" type="button">请假条</button>
        </div>
        <!-- 默认第二条：已销假 -->
        <div class="leave-card has-student" data-record-id="default-20260719" data-start-time="2026-07-19T11:40">
            <div class="corner-tag-purple"><span>已销假</span></div>
            <div class="row-item">
                <span class="label-text">学号</span>
                <span class="value-text">2025903066</span>
                <span class="detail-link" onclick="showDetail(this.closest('.leave-card'))">查看详情 ›</span>
            </div>
            <div class="row-item">
                <span class="label-text">姓名</span>
                <span class="value-text">王贺</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假时间</span>
                <span class="value-text time-value">2026-07-19 11:40至2026-07-19 19:40</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假时长</span>
                <span class="value-text">0天8小时</span>
            </div>
            <div class="row-item">
                <span class="label-text">是否续假</span>
                <span class="value-text">否</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假原因</span>
                <span class="value-text">校外:周末外出</span>
            </div>
            <div class="row-item">
                <span class="label-text">销假状态</span>
                <span class="value-text">已销假</span>
            </div>
            <button class="btn-teal" type="button">请假条</button>
        </div>
    </div>
    <!-- 提交请假按钮 -->
    <button class="btn-bottom" onclick="jumpToSubmitPage()">提交请假</button>
       <script>
        window.onload = function(){
            const leaveList = migrateLeaveList();
            renderNewLeaveCards(leaveList);
            applyStaticOverrides();
            applyUserProfile();
            updateLeaveStatuses(leaveList);
        }

        /**
         * 格式化ISO时间，去除T，输出 2026-08-22 01:00
         */
        function formatIsoTime(isoStr) {
            if (!isoStr) return "";
            return isoStr.replace("T"," ").substring(0,16);
        }

        function normalizeReason(reason){
            if (reason === '外出') return '周末外出';
            return reason.replace(/^校外:/, '');
        }

        function formatReason(reason){
            return `校外:${normalizeReason(reason)}`;
        }

        function migrateLeaveList(){
            const leaveList = JSON.parse(localStorage.getItem('leaveList')) || [];
            const migrated = leaveList.map((item, index) => {
                if (!item.startTime || !item.endTime) {
                    const times = item.time.split(' 至 ');
                    item.startTime = times[0];
                    item.endTime = times[1];
                    item.duration = item.long;
                    delete item.time;
                    delete item.long;
                }
                if (!item.id) item.id = `leave-${item.startTime}-${index}`;
                item.reason = normalizeReason(item.reason);
                return item;
            });
            localStorage.setItem('leaveList', JSON.stringify(migrated));
            return migrated;
        }

        function renderNewLeaveCards(leaveList){
            const container = document.getElementById('leaveListContainer');
            const cardsHtml = leaveList.map(item => {
                const showTime = formatIsoTime(item.startTime) + "至" + formatIsoTime(item.endTime);
                const durationStr = item.duration;
                return `
                <div class="leave-card has-student" data-record-id="${item.id}" data-start-time="${item.startTime}">
                    <div class="corner-tag-orange"><span>待销假</span></div>
                    <div class="row-item">
                        <span class="label-text">学号</span>
                        <span class="value-text">2025903066</span>
                        <span class="detail-link" onclick="showDetail(this.closest('.leave-card'))">查看详情 ›</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">姓名</span>
                        <span class="value-text">王贺</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">请假时间</span>
                        <span class="value-text time-value">${showTime}</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">请假时长</span>
                        <span class="value-text">${durationStr}</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">是否续假</span>
                        <span class="value-text">是</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">请假原因</span>
                        <span class="value-text">${formatReason(item.reason)}</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">销假状态</span>
                        <span class="value-text">${item.status}</span>
                    </div>
                    <button class="btn-teal" type="button">请假条</button>
                </div>
                `;
            }).join('');
            container.insertAdjacentHTML('afterbegin', cardsHtml);
        }

        function applyStaticOverrides(){
            const overrides = JSON.parse(localStorage.getItem('leaveRecordOverrides')) || {};
            Object.entries(overrides).forEach(([recordId, record]) => {
                const card = document.querySelector(`[data-record-id="${recordId}"]`);
                if (!card) return;
                card.dataset.startTime = record.startTime;
                const values = {
                    '请假时间': formatIsoTime(record.startTime) + '至' + formatIsoTime(record.endTime),
                    '请假时长': record.duration,
                    '请假原因': formatReason(record.reason)
                };
                card.querySelectorAll('.row-item').forEach(row => {
                    const label = row.querySelector('.label-text');
                    const value = row.querySelector('.value-text');
                    if (label && value && values[label.textContent] !== undefined) {
                        value.textContent = values[label.textContent];
                    }
                });
            });
        }

        function applyUserProfile(){
            document.querySelectorAll('.leave-card .row-item').forEach(row => {
                const label = row.querySelector('.label-text');
                const value = row.querySelector('.value-text');
                if (!label || !value) return;
                if (label.textContent === '姓名') value.textContent = window.siteProfile.name;
                if (label.textContent === '学号') value.textContent = window.siteProfile.studentId;
            });
        }

        function updateLeaveStatuses(leaveList){
            const cards = Array.from(document.querySelectorAll('.leave-card'));
            const latestCard = cards[0];
            const statusOverrides = JSON.parse(localStorage.getItem('leaveStatusOverrides')) || {};

            cards.forEach(card => {
                const isLatest = card === latestCard;
                const savedStatus = statusOverrides[card.dataset.recordId];
                const status = savedStatus !== undefined ? savedStatus : (isLatest ? '待销假' : '已销假');
                const tag = card.querySelector('[class^="corner-tag-"]');
                tag.className = status === '待销假' ? 'corner-tag-orange' : 'corner-tag-purple';
                tag.querySelector('span').textContent = status;
                const statusRow = Array.from(card.querySelectorAll('.row-item')).find(row =>
                    row.querySelector('.label-text').textContent === '销假状态'
                );
                statusRow.querySelector('.value-text').textContent = status;
            });

            leaveList.forEach(item => {
                const card = document.querySelector(`[data-record-id="${item.id}"]`);
                const statusRow = Array.from(card.querySelectorAll('.row-item')).find(row =>
                    row.querySelector('.label-text').textContent === '销假状态'
                );
                item.status = statusRow.querySelector('.value-text').textContent;
            });
            localStorage.setItem('leaveList', JSON.stringify(leaveList));
        }
        function showDetail(card) {
            const values = {};
            card.querySelectorAll('.row-item').forEach(row => {
                const label = row.querySelector('.label-text');
                const value = row.querySelector('.value-text');
                if (label && value) values[label.textContent] = value.textContent;
            });
            localStorage.setItem('selectedLeaveRecord', JSON.stringify({
                id: card.dataset.recordId,
                leaveTime: values['请假时间'],
                total: values['请假时长'],
                reason: normalizeReason(values['请假原因']),
                status: values['销假状态']
            }));
            window.location.replace("leave-detail.html");
        }
        function jumpToSubmitPage() {
            localStorage.setItem('selectedLeaveRecord', JSON.stringify({
                id: 'leave-' + Date.now(),
                isNew: true,
                leaveTime: '',
                total: '',
                reason: '',
                status: '待销假'
            }));
            window.location.replace("leave-detail.html");
        }
    </script>
</body>
</html>
