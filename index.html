<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日常请假列表</title>
    <script src="auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
        }
        body {
            width: min(100%, 630px);
            max-width: none;
            margin: 0 auto;
            overflow-x: hidden;
            background: #f2f3f5;
			padding-bottom: calc(min(12.381vw, 96px) + 20px);
        }
        /* 630 × 1260 参考图等比例布局 */
        .nav-bar {
            width: 100%;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid #e6e6e6;
            display: none;
        }
        .nav-left {
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
            top: 2px;
        }
        .nav-icon {
            position: relative;
            width: 40px;
            height: 40px;
            color: transparent;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .nav-icon:first-child::before {
            content: "";
            position: absolute;
            left: 16px;
            top: 50%;
            width: 16px;
            height: 16px;
            border-left: 3px solid #111;
            border-bottom: 3px solid #111;
            transform: translateY(-50%) rotate(45deg);
        }
        .nav-icon:nth-child(2) {
            margin-left: 49px;
        }
        .nav-icon:nth-child(2)::before,
        .nav-icon:nth-child(2)::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 29px;
            height: 3px;
            border-radius: 1.5px;
            background: #111;
        }
        .nav-icon:nth-child(2)::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .nav-icon:nth-child(2)::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .nav-title {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 2px);
            color: #050505;
            font-size: 18px;
            line-height: 1;
            font-weight: 500;
            white-space: nowrap;
        }
        .nav-right {
            width: 74px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            position: relative;
            top: 3px;
        }
        .nav-right::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #050505;
            box-shadow: 11px 0 #050505, 22px 0 #050505;
            transform: translateX(-11px);
        }
        #leaveListContainer {
            padding: 0;
        }
        .list-end {
            min-height: min(24vw, 150px);
            padding: min(7vw, 44px) 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: #f2f3f5;
            color: #999;
            font-size: min(3.5vw, 20px);
            line-height: min(4.762vw, 30px);
        }
        .leave-card {
            width: 100%;
            height: min(76.19vw, 480px);
            padding: min(3.968vw, 25px) min(4.127vw, 26px) min(4.444vw, 28px);
            position: relative;
            overflow: hidden;
            margin-bottom: min(2.54vw, 16px);
            background: #fff;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
        }
        .leave-card.has-student {
			height: auto;                      /* 高度自适应内容 */
            min-height: min(87.143vw, 549px);
            padding-top: min(5.714vw, 36px);
        }
        .row-item {
            height: min(4.762vw, 30px);
            margin-bottom: min(4.603vw, 29px);
            display: flex;
            align-items: center;
            line-height: min(4.762vw, 30px);
            white-space: nowrap;
			gap: 20px;
        }
        .row-item:last-of-type {
            margin-bottom: min(5.397vw, 34px);
        }
        .leave-card.has-student .row-item:last-of-type {
            margin-bottom: min(5.079vw, 32px);
        }
        .label-text {
            min-width: min(18.254vw, 115px);
            flex-shrink: 0;
            color: #222;
            font-size: min(3.81vw, 23px);
            font-weight: 400;
        }
		    /* 新增：只针对请假时间行 */
		.row-item.time-row {
			height: min(4.762vw, 30px); 
			min-height: min(4.762vw, 30px);
			white-space: nowrap;
			align-items: center;
		}

		.row-item.time-row .value-text {
			word-break: normal;
			overflow-wrap: anywhere;
			line-height: min(4.762vw, 30px);
		}
        .value-text {
            flex: 1;
            min-width: 0;
            color: #999;
            font-size: min(3.968vw, 22px);
            font-weight: 400;
        }
        .status-text {
            font-size: min(3.968vw, 22px);
        }
        .time-value {
            letter-spacing: max(-.01vw, -.06px);
        }
        .detail-link {
            flex-shrink: 0;
            margin-left: 10px;
            color: #45c7c7;
            font-size: min(3vw, 18px);
            cursor: pointer;
        }
        .btn-teal {
            width: min(30vw, 180px);
            height: min(10vw, 50px);
            margin: 30px auto 20px;
            display: block;
            border: 0;
            border-radius: min(2.222vw, 14px);
            background: linear-gradient(90deg, #27e2d4 0%, #1878e8 100%);
            color: #fff;
            font-size: min(4vw, 20px);
            font-weight: 400;
            cursor: default;
            pointer-events: none;
        }
        .corner-tag-orange,
        .corner-tag-purple {
            position: absolute;
            right: 0;
            bottom: 0;
            width: min(10vw, 60px);
            height: min(10vw, 60px);
            color: #fff;
            font-size: 15px;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
        }
        .corner-tag-orange::before,
        .corner-tag-purple::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }
        .corner-tag-orange::before {
            background: #ff9a3c;
        }
        .corner-tag-purple::before {
            background: #9854d1;
        }
		.corner-tag-orange span,
		.corner-tag-purple span {
			position: absolute;
			inset: 0;          /* top right bottom left全部为0 */
			margin: auto;      /* 自动居中 */
			width: min(10vw, 20px);
			height: min(10vw, 20px);
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 300;  /* 字体变细 */
			font-size: min(2.5vw, 14px);   /* 随屏幕变化 */
			text-align: center;
			transform: rotate(-45deg) translate(min(0.6vw, 10px), min(2.0vw, 12px));
		}
        /* 新增：强制绘制右下角白色三角缺口，不再依赖文字溢出 */
        .corner-tag-orange::after,
        .corner-tag-purple::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-bottom: min(4vw,25px) solid #ffffff;
            border-left: min(4vw,25px) solid transparent;
        }

		.btn-bottom {
			position: fixed;
			bottom: max(8px, env(safe-area-inset-bottom));
			left: 50%;
			transform: translateX(-50%);
			width: min(100%, 630px);
			max-width: none;
			height: min(25vw, 50px);
			border: none;
			border-radius: 0;
			background: linear-gradient(90deg, #27e2d4 0%, #1878e8 100%);
			color: #ffffff;
			font-size: min(4vw, 20px);
			font-weight: 400;
			letter-spacing: 2px;
			cursor: pointer;
			z-index: 100;
			transition: opacity 0.2s;
		}

        .btn-bottom:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- 请假列表 -->
    <div id="leaveListContainer">
        <!-- 默认第一条：待销假 -->
        <div class="leave-card has-student" data-record-id="default-20260826" data-start-time="2026-08-26T23:44">
            <div class="corner-tag-orange"><span>待销假</span></div>
            <div class="row-item">
                <span class="label-text">学号</span>
                <span class="value-text">2025903066</span>
                <span class="detail-link" onclick="showDetail(this.closest('.leave-card'))">查看详情 ›</span>
            </div>
            <div class="row-item">
                <span class="label-text">姓名</span>
                <span class="value-text">王贺</span>
            </div>
            <div class="row-item time-row">
                <span class="label-text">请假时间</span>
                <span class="value-text time-value">2026-08-26 23:44至2026-08-27 07:44</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假时长</span>
                <span class="value-text">0天8小时</span>
            </div>
            <div class="row-item">
                <span class="label-text">是否续假</span>
                <span class="value-text">否</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假原因</span>
                <span class="value-text">校外:周末外出</span>
            </div>
            <div class="row-item">
                <span class="label-text">销假状态</span>
                <span class="value-text status-text">待销假</span>
            </div>
            <button class="btn-teal" type="button">请假条</button>
        </div>
        <!-- 默认第二条：已销假 -->
        <div class="leave-card has-student" data-record-id="default-20260719" data-start-time="2026-07-19T11:40">
            <div class="corner-tag-purple"><span>已销假</span></div>
            <div class="row-item">
                <span class="label-text">学号</span>
                <span class="value-text">2025903066</span>
                <span class="detail-link" onclick="showDetail(this.closest('.leave-card'))">查看详情 ›</span>
            </div>
            <div class="row-item">
                <span class="label-text">姓名</span>
                <span class="value-text">王贺</span>
            </div>
			<div class="row-item time-row">
				<span class="label-text">请假时间</span>
				<span class="value-text time-value">2026-07-19 11:40至2026-07-19 19:40</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假时长</span>
                <span class="value-text">0天8小时</span>
            </div>
            <div class="row-item">
                <span class="label-text">是否续假</span>
                <span class="value-text">否</span>
            </div>
            <div class="row-item">
                <span class="label-text">请假原因</span>
                <span class="value-text">校外:周末外出</span>
            </div>
            <div class="row-item">
                <span class="label-text">销假状态</span>
                <span class="value-text status-text">已销假</span>
            </div>
            <button class="btn-teal" type="button">请假条</button>
        </div>
        <div class="list-end">已经到底了哦</div>
    </div>
    <!-- 提交请假按钮 -->
        <button class="btn-bottom" onclick="jumpToSubmitPage()">提交请假</button>
       <script>
		if (!history.state || !history.state.leaveList) {
			history.pushState({ leaveList: true }, '', location.href);
			}
			window.addEventListener('popstate', () => {
			// 关闭当前页面
			window.close();
			});
        window.onload = function(){
            const leaveList = migrateLeaveList();
            renderNewLeaveCards(leaveList);
            applyStaticOverrides();
            applyUserProfile();
            applyDeletedRecords();
            sortLeaveCards();
            attachLongPressHandlers();
            updateLeaveStatuses(leaveList);
        }

        /**
         * 格式化ISO时间，去除T，输出 2026-08-22 01:00
         */
        function formatIsoTime(isoStr) {
            if (!isoStr) return "";
            return isoStr.replace("T"," ").substring(0,16);
        }

        function normalizeReason(reason){
            if (String(reason) === '1') return '周末外出';
            if (reason === '外出') return '周末外出';
            return reason.replace(/^校外:/, '');
        }

        function formatReason(reason){
            return `校外:${normalizeReason(reason)}`;
        }

        function formatDuration(startTime, endTime){
            const totalHours = Math.floor((new Date(endTime) - new Date(startTime)) / 3600000);
            return `${Math.floor(totalHours / 24)}天${totalHours % 24}小时`;
        }

        function migrateLeaveList(){
            const leaveList = JSON.parse(localStorage.getItem('leaveList')) || [];
            const deletedIds = JSON.parse(localStorage.getItem('deletedLeaveRecordIds')) || [];
            const migrated = leaveList.filter(item => !deletedIds.includes(item.id)).map((item, index) => {
                if (!item.startTime || !item.endTime) {
                    const times = item.time.split(' 至 ');
                    item.startTime = times[0];
                    item.endTime = times[1];
                    item.duration = item.long;
                    delete item.time;
                    delete item.long;
                }
                if (!item.id) item.id = `leave-${item.startTime}-${index}`;
                item.duration = formatDuration(item.startTime, item.endTime);
                item.reason = normalizeReason(item.reason);
                return item;
            }).sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
            localStorage.setItem('leaveList', JSON.stringify(migrated));
            return migrated;
        }

        function applyDeletedRecords(){
            const deletedIds = JSON.parse(localStorage.getItem('deletedLeaveRecordIds')) || [];
            document.querySelectorAll('.leave-card').forEach(card => {
                if (deletedIds.includes(card.dataset.recordId)) card.remove();
            });
        }

        function sortLeaveCards(){
            const container = document.getElementById('leaveListContainer');
            const endMarker = container.querySelector('.list-end');
            Array.from(container.querySelectorAll('.leave-card'))
                .sort((a, b) => new Date(b.dataset.startTime) - new Date(a.dataset.startTime))
                .forEach(card => container.insertBefore(card, endMarker));
        }

        function attachLongPressHandlers(){
            document.querySelectorAll('.leave-card').forEach(card => {
                let timer;
                const cancel = () => { clearTimeout(timer); timer = undefined; };
                card.addEventListener('pointerdown', () => {
                    timer = setTimeout(() => {
                        const deletedIds = JSON.parse(localStorage.getItem('deletedLeaveRecordIds')) || [];
                        if (!deletedIds.includes(card.dataset.recordId)) deletedIds.push(card.dataset.recordId);
                        localStorage.setItem('deletedLeaveRecordIds', JSON.stringify(deletedIds));
                        const leaveList = JSON.parse(localStorage.getItem('leaveList')) || [];
                        localStorage.setItem('leaveList', JSON.stringify(leaveList.filter(item => item.id !== card.dataset.recordId)));
                        card.remove();
                        timer = undefined;
                    }, 3000);
                });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(event => card.addEventListener(event, cancel));
                card.addEventListener('contextmenu', event => event.preventDefault());
            });
        }

        function renderNewLeaveCards(leaveList){
            const container = document.getElementById('leaveListContainer');
            const cardsHtml = leaveList.map(item => {
                const showTime = formatIsoTime(item.startTime) + "至" + formatIsoTime(item.endTime);
                const durationStr = formatDuration(item.startTime, item.endTime);
                return `
                <div class="leave-card has-student" data-record-id="${item.id}" data-start-time="${item.startTime}">
                    <div class="corner-tag-orange"><span>待销假</span></div>
                    <div class="row-item">
                        <span class="label-text">学号</span>
                        <span class="value-text">2025903066</span>
                        <span class="detail-link" onclick="showDetail(this.closest('.leave-card'))">查看详情 ›</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">姓名</span>
                        <span class="value-text">王贺</span>
                    </div>
                    <div class="row-item time-row">
                        <span class="label-text">请假时间</span>
                        <span class="value-text time-value">${showTime}</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">请假时长</span>
                        <span class="value-text">${durationStr}</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">是否续假</span>
                        <span class="value-text">否</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">请假原因</span>
                        <span class="value-text">${formatReason(item.reason)}</span>
                    </div>
                    <div class="row-item">
                        <span class="label-text">销假状态</span>
                        <span class="value-text status-text">${item.status}</span>
                    </div>
                    <button class="btn-teal" type="button">请假条</button>
                </div>
                `;
            }).join('');
            container.insertAdjacentHTML('afterbegin', cardsHtml);
        }

        function applyStaticOverrides(){
            const overrides = JSON.parse(localStorage.getItem('leaveRecordOverrides')) || {};
            Object.entries(overrides).forEach(([recordId, record]) => {
                const card = document.querySelector(`[data-record-id="${recordId}"]`);
                if (!card) return;
                card.dataset.startTime = record.startTime;
                const values = {
                    '请假时间': formatIsoTime(record.startTime) + '至' + formatIsoTime(record.endTime),
                    '请假时长': formatDuration(record.startTime, record.endTime),
                    '请假原因': formatReason(record.reason)
                };
                card.querySelectorAll('.row-item').forEach(row => {
                    const label = row.querySelector('.label-text');
                    const value = row.querySelector('.value-text');
                    if (label && value && values[label.textContent] !== undefined) {
                        value.textContent = values[label.textContent];
                    }
                });
            });
        }

        function applyUserProfile(){
            document.querySelectorAll('.leave-card .row-item').forEach(row => {
                const label = row.querySelector('.label-text');
                const value = row.querySelector('.value-text');
                if (!label || !value) return;
                if (label.textContent === '姓名') value.textContent = window.siteProfile.name;
                if (label.textContent === '学号') value.textContent = window.siteProfile.studentId;
            });
        }

        function updateLeaveStatuses(leaveList){
            const cards = Array.from(document.querySelectorAll('.leave-card'));
            const latestCard = cards[0];
            const statusOverrides = JSON.parse(localStorage.getItem('leaveStatusOverrides')) || {};
            let hasPending = false;

            cards.forEach(card => {
                const isLatest = card === latestCard;
                const savedStatus = statusOverrides[card.dataset.recordId];
                const status = isLatest && savedStatus !== '已销假' ? '待销假' : '已销假';
                if (status === '待销假') hasPending = true;
                const tag = card.querySelector('[class^="corner-tag-"]');
                tag.className = status === '待销假' ? 'corner-tag-orange' : 'corner-tag-purple';
                tag.querySelector('span').textContent = status;
                const statusRow = Array.from(card.querySelectorAll('.row-item')).find(row =>
                    row.querySelector('.label-text').textContent === '销假状态'
                );
                statusRow.querySelector('.value-text').textContent = status;
                statusOverrides[card.dataset.recordId] = status;
            });
            document.querySelector('.btn-bottom').textContent = hasPending ? '提交续假' : '提交请假';
            localStorage.setItem('leaveStatusOverrides', JSON.stringify(statusOverrides));

            leaveList.forEach(item => {
                const card = document.querySelector(`[data-record-id="${item.id}"]`);
                const statusRow = Array.from(card.querySelectorAll('.row-item')).find(row =>
                    row.querySelector('.label-text').textContent === '销假状态'
                );
                item.status = statusRow.querySelector('.value-text').textContent;
            });
            localStorage.setItem('leaveList', JSON.stringify(leaveList));
        }
        function showDetail(card) {
            const values = {};
            card.querySelectorAll('.row-item').forEach(row => {
                const label = row.querySelector('.label-text');
                const value = row.querySelector('.value-text');
                if (label && value) values[label.textContent] = value.textContent;
            });
            const detail = JSON.parse(localStorage.getItem(`leaveDetail:${card.dataset.recordId}`) || '{}');
            localStorage.setItem('selectedLeaveRecord', JSON.stringify({
                id: card.dataset.recordId,
                leaveTime: values['请假时间'],
                total: values['请假时长'],
                reason: normalizeReason(values['请假原因']),
                leaveType: detail.leaveType || '校外',
                description: detail.description || '',
                status: values['销假状态']
            }));
            window.location.replace("leave-detail.html");
        }
        function jumpToSubmitPage() {
            localStorage.setItem('selectedLeaveRecord', JSON.stringify({
                id: 'leave-' + Date.now(),
                isNew: true,
                leaveTime: '',
                total: '',
                reason: '',
                status: '待销假'
            }));
            window.location.replace("leave-detail.html");
        }
    </script>
</body>
</html>
