<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>进入请假系统</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{width:100%;min-height:100vh;background:#f2f3f5}
        body{width:min(100%,630px);margin:0 auto;display:flex;align-items:center;justify-content:center;padding:24px}
        .login-card{width:100%;padding:34px 28px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
        h1{text-align:center;font-size:min(4vw,24px);font-weight:500;margin-bottom:30px}
        .form-row{margin-bottom:20px}.form-row label{display:block;margin-bottom:8px;font-size:min(3vw,18px);color:#333}
        .form-row input{width:100%;height:48px;border:1px solid #ddd;border-radius:7px;padding:0 14px;outline:none;font-size:16px;color:#333}.form-row input:focus{border-color:#55c7c4}
        .password-mask{-webkit-text-security:disc}
        .enter-btn{width:100%;height:50px;margin-top:8px;border:0;border-radius:8px;background:linear-gradient(90deg,#27e2d4,#1878e8);color:#fff;font-size:min(3vw,18px);cursor:pointer}
    </style>
</head>
<body>
    <form class="login-card" onsubmit="enterWebsite(event)">
        <h1>请填写进入信息</h1>
        <div class="form-row"><label for="password">密码</label><input id="password" class="password-mask" type="text" inputmode="text" autocomplete="off" required></div>
        <div class="form-row"><label for="studentName">姓名</label><input id="studentName" autocomplete="off" required></div>
        <div class="form-row"><label for="studentId">学号</label><input id="studentId" inputmode="numeric" autocomplete="off" required></div>
        <button class="enter-btn" type="submit">进入</button>
    </form>
    <script>
        function enterWebsite(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const name = document.getElementById('studentName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            if (password !== '我是小狗') {
                alert('密码错误');
                return;
            }
            if (!name || !studentId) return;
            sessionStorage.setItem('siteAccess', JSON.stringify({name, studentId}));
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
